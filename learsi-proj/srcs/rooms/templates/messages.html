<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ room_path }} chat</title>
    <style>
        :root {
            --bg: #1a1f1c;
            --panel: #243028;
            --ink: #e8f0ea;
            --muted: #9bb0a2;
            --accent: #c4a35a;
            --line: #3a4a40;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at top, #2c3b32 0%, transparent 55%),
                var(--bg);
            color: var(--ink);
        }
        main {
            max-width: 42rem;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }
        h1 {
            font-family: "IBM Plex Serif", Georgia, serif;
            font-weight: 600;
            font-size: 1.6rem;
            margin: 0 0 0.35rem;
        }
        .meta {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }
        .meta a { color: var(--accent); }
        .log {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            min-height: 16rem;
            max-height: 50vh;
            overflow-y: auto;
            padding: 1rem 1.1rem;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 0.92rem;
            line-height: 1.45;
            margin-bottom: 1rem;
        }
        .log:empty::before {
            content: "No messages yet. Say hello.";
            color: var(--muted);
            font-family: "IBM Plex Sans", sans-serif;
        }
        form {
            display: grid;
            gap: 0.75rem;
        }
        textarea {
            width: 100%;
            min-height: 5rem;
            resize: vertical;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #151a17;
            color: var(--ink);
            padding: 0.85rem 1rem;
            font: inherit;
        }
        textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        button {
            justify-self: start;
            border: 0;
            border-radius: 8px;
            padding: 0.7rem 1.25rem;
            background: var(--accent);
            color: #1a1508;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.05); }
    </style>
</head>
<body>
    <main>
        <h1>Room chat</h1>
        <p class="meta">
            guest <strong>{{ se }}</strong> · room {{ room_path }}
            · <a href="/room/">rooms</a>
        </p>
        <div class="log">{{ messages }}</div>
        <form method="post" action="/room/{{ room_path }}/messages">
            <label for="message" class="meta">New message</label>
            <textarea id="message" name="message" maxlength="500" required placeholder="Type a message…"></textarea>
            <button type="submit">Send</button>
        </form>
    </main>
</body>
</html>
